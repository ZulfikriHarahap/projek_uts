name: projek_uts
description: "Aplikasi Kuis Pilihan Ganda - UTS Pemrograman Mobile"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2        # State management (ChangeNotifier + Provider)
  image_picker: ^1.1.2    # Pilih foto profil dari galeri

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Aset gambar dan ikon
  assets:
    - assets/images/
    - assets/icons/

  # Font Poppins dari aset lokal
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
